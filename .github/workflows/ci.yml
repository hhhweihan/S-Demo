name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

# The build is driven entirely by the aggregate root CMakeLists; every job below is
# `configure -> build -> ctest`, differing only in the sanitizer knob. Sanitizer jobs
# exist because the concurrency modules (thread_pool, lock_free, async_logger) are where
# races and UB actually hide, and a green unit-test run alone does not prove they're clean.
jobs:
  build-test:
    name: build & test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure -j2 -LE integration

  asan-ubsan:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DS_DEMO_SANITIZER=address
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure -j2 -LE integration

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DS_DEMO_SANITIZER=thread
      - name: Build
        run: cmake --build build -j
      # Disable ASLR for the test run: ubuntu-latest's kernel uses high-entropy ASLR
      # (vm.mmap_rnd_bits=32), which collides with TSan's fixed shadow-memory mapping and
      # aborts every binary with "FATAL: ThreadSanitizer: unexpected memory mapping".
      # `setarch -R` clears ADDR_NO_RANDOMIZE for ctest; child test processes inherit it.
      - name: Test
        run: setarch "$(uname -m)" -R ctest --test-dir build --output-on-failure -j2 -LE integration

  format-check:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin the exact clang-format version. apt's clang-format tracks the distro's
      # LLVM and drifts between runner images, so its formatting verdict differs from
      # what a contributor runs locally -- a moving target that fails on style noise,
      # not real defects. The PyPI wheel is byte-identical everywhere; bump this pin
      # deliberately and reformat in the same commit.
      - name: Install clang-format
        run: pipx install clang-format==22.1.8
      - name: Check formatting
        run: |
          clang-format --version
          files=$(find CPP-Practice -name '*.h' -o -name '*.cpp' | grep -v '/build')
          clang-format --dry-run --Werror $files
